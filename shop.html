<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Boutique VIP</title>
    <style>
        /* DESIGN CONSERVÉ À L'IDENTIQUE */
        :root { --primary: #f39c12; --primary-dark: #d35400; --dark-bg: rgba(0, 0, 0, 0.85); --glass: rgba(255, 255, 255, 0.1); --card-bg: rgba(30, 30, 30, 0.95); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; color: white; padding-bottom: 100px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); z-index: -1; }
        header { background: var(--dark-bg); padding: 15px; text-align: center; border-bottom: 2px solid var(--primary); position: sticky; top: 0; z-index: 10; backdrop-filter: blur(10px); }
        .balance-header { background: linear-gradient(to right, rgba(243, 156, 18, 0.2), transparent); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--glass); margin-bottom: 10px; }
        .balance-amount { font-size: 1.4em; font-weight: bold; color: var(--primary); }
        .container { padding: 10px 15px; display: flex; flex-direction: column; gap: 12px; }
        
        .product-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--glass); padding: 12px; display: flex; flex-direction: row; align-items: center; gap: 15px; }
        .vip-image { width: 70px; height: 70px; border-radius: 10px; border: 2px solid var(--primary); object-fit: cover; }
        
        .btn-buy { background: var(--primary); color: black; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 15px 0; border-top: 1px solid var(--glass); }
        .nav-item { color: #666; text-decoration: none; font-size: 0.8em; text-align: center; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>
<div class="overlay"></div>
<header><h2>BOUTIQUE SOLAIRE</h2></header>
<div class="balance-header"><div>Solde :</div><div class="balance-amount" id="user-balance">0 CDF</div></div>
<div class="container" id="product-list"></div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span>🏠 Accueil</span></a>
    <a href="shop.html" class="nav-item active"><span>☀️ Produits</span></a>
    <a href="equipe.html" class="nav-item"><span>👥 Équipe</span></a>
    <a href="profil.html" class="nav-item"><span>👤 Profil</span></a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, get, update, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem('userPhone');

    const products = [
        { id: 1, name: "VIP 1", price: 20000, daily: 4600, img: "IMG_3032.jpeg" },
        { id: 2, name: "VIP 2", price: 40000, daily: 9200, img: "IMG_3033.jpeg" },
        { id: 3, name: "VIP 3", price: 75000, daily: 17250, img: "IMG_3034.jpeg" },
        { id: 4, name: "VIP 4", price: 120000, daily: 27600, img: "IMG_3035.jpeg" },
        { id: 5, name: "VIP 5", price: 250000, daily: 57500, img: "IMG_3036.jpeg" },
        { id: 6, name: "VIP 6", price: 400000, daily: 92000, img: "IMG_3037.jpeg" },
        { id: 7, name: "VIP 7", price: 800000, daily: 184000, img: "IMG_3038.jpeg" },
        { id: 8, name: "VIP 8", price: 1200000, daily: 276000, img: "IMG_3039.jpeg" }
    ];

    const container = document.getElementById('product-list');
    products.forEach(p => {
        container.innerHTML += `
            <div class="product-card">
                <img src="${p.img}" class="vip-image" alt="${p.name}">
                <div style="flex-grow:1">
                    <div style="font-weight:bold">${p.name} - ${p.price.toLocaleString()} CDF</div>
                    <small style="color: #27ae60;">Gain : ${p.daily.toLocaleString()} FC/jour</small>
                </div>
                <button class="btn-buy" onclick="buyProduct(${p.id})">INVESTIR</button>
            </div>`;
    });

    if (userPhone) {
        onValue(ref(db, 'users/' + userPhone + '/solde'), (s) => {
            document.getElementById('user-balance').innerText = (s.val() || 0).toLocaleString() + " CDF";
        });
    }

    window.buyProduct = async (productId) => {
        if (!userPhone) return alert("Veuillez vous connecter.");
        const product = products.find(p => p.id === productId);
        const userRef = ref(db, 'users/' + userPhone);
        const snap = await get(userRef);
        const userData = snap.val();

        if (userData.solde < product.price) return alert("Solde insuffisant !");

        if (confirm(`Acheter ${product.name} pour ${product.price.toLocaleString()} CDF ?`)) {
            // 1. Déduction du solde et activation du gain quotidien
            await update(userRef, { 
                solde: userData.solde - product.price,
                gain_quotidien_actif: (userData.gain_quotidien_actif || 0) + product.daily
            });

            // 2. DISTRIBUTION MLM : N1(25%), N2(3%), N3(1%)
            const distribution = [0.25, 0.03, 0.01];
            let currentParentPhone = userData.parraine_par;

            for (let i = 0; i < distribution.length; i++) {
                if (!currentParentPhone) break;

                const parentRef = ref(db, 'users/' + currentParentPhone);
                const parentSnap = await get(parentRef);

                if (parentSnap.exists()) {
                    const pData = parentSnap.val();
                    const gainMLM = product.price * distribution[i];

                    await update(parentRef, {
                        solde: (pData.solde || 0) + gainMLM,
                        commissions: (pData.commissions || 0) + gainMLM
                    });

                    // Passer au parrain du dessus pour le niveau suivant
                    currentParentPhone = pData.parraine_par;
                } else {
                    break; 
                }
            }

            // 3. Ajouter aux panneaux achetés de l'utilisateur
            await push(ref(db, 'users/' + userPhone + '/mes_panneaux'), {
                nom: product.name, 
                daily: product.daily, 
                date_achat: new Date().toISOString()
            });

            alert("Investissement réussi ! Vos gains et les commissions de parrainage ont été mis à jour.");
        }
    };
</script>
</body>
</html>
