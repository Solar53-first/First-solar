<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Panneaux - First Solar</title>
    <style>
        :root { --primary: #f39c12; --dark-bg: rgba(0, 0, 0, 0.9); --glass: rgba(255, 255, 255, 0.1); }
        body {
            margin: 0; font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover; color: white; padding-bottom: 20px;
        }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.8); z-index: -1; }
        header { background: var(--dark-bg); padding: 20px; text-align: center; border-bottom: 2px solid var(--primary); }
        .container { padding: 15px; }
        .panel-card {
            background: var(--glass); border-left: 4px solid var(--primary);
            padding: 15px; border-radius: 10px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .panel-info h3 { margin: 0; color: var(--primary); font-size: 1.1em; }
        .panel-info p { margin: 5px 0 0; font-size: 0.85em; opacity: 0.8; }
        .status { color: #27ae60; font-weight: bold; font-size: 0.8em; }
        .back-btn {
            display: inline-block; margin: 10px; color: white; text-decoration: none; font-size: 0.9em;
        }
    </style>
</head>
<body>
<div class="overlay"></div>
<header>
    <a href="profil.html" class="back-btn">⬅ Retour</a>
    <h2 style="margin:0;">MES PANNEAUX ACTIFS</h2>
</header>

<div class="container" id="my-panels-list">
    <p id="loading-msg" style="text-align:center;">Chargement de vos équipements...</p>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem('userPhone');

    if (!userPhone) { window.location.href = "login.html"; }

    const panelsRef = ref(db, 'users/' + userPhone + '/mes_panneaux');
    onValue(panelsRef, (snapshot) => {
        const container = document.getElementById('my-panels-list');
        container.innerHTML = "";
        
        if (snapshot.exists()) {
            const data = snapshot.val();
            Object.values(data).forEach(panel => {
                const dateAchat = new Date(panel.date_achat).toLocaleDateString();
                container.innerHTML += `
                    <div class="panel-card">
                        <div class="panel-info">
                            <h3>${panel.nom}</h3>
                            <p>Acheté le : ${dateAchat}</p>
                            <p>Revenu : <b>${panel.daily} FC / jour</b></p>
                        </div>
                        <div class="status">● ACTIF</div>
                    </div>
                `;
            });
        } else {
            container.innerHTML = "<p style='text-align:center;'>Vous n'avez aucun panneau actif.</p>";
        }
    });
</script>
</body>
</html>
