<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Historique</title>
    <style>
        :root {
            --primary: #f39c12;
            --dark-bg: rgba(0, 0, 0, 0.9);
            --glass: rgba(255, 255, 255, 0.05);
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white; padding-bottom: 80px;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8); z-index: -1;
        }

        header {
            background: var(--dark-bg); padding: 15px;
            text-align: center; border-bottom: 2px solid var(--primary);
        }

        .tabs { display: flex; background: rgba(0,0,0,0.5); }

        .tab {
            flex: 1; padding: 15px; text-align: center;
            cursor: pointer; border-bottom: 3px solid transparent;
            font-size: 0.9em; opacity: 0.6;
        }

        .tab.active {
            opacity: 1; border-color: var(--primary);
            color: var(--primary); font-weight: bold;
        }

        .container { padding: 20px; }

        .content { display: none; animation: fadeIn 0.4s; }
        .content.active { display: block; }

        /* --- Style pour l'état Vide --- */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            opacity: 0.5;
        }

        .empty-state svg {
            width: 60px; height: 60px; fill: var(--primary);
            margin-bottom: 15px;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #111; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid var(--glass);
        }
        .nav-item { color: #666; text-decoration: none; font-size: 0.8em; text-align: center; }
    </style>
</head>
<body>

<div class="overlay"></div>

<header>
    <h2 style="margin:0;">MON HISTORIQUE</h2>
</header>

<div class="tabs">
    <div class="tab active" onclick="openTab(event, 'revenus')">📈 Revenus</div>
    <div class="tab" onclick="openTab(event, 'retraits')">💸 Retraits</div>
</div>

<div class="container">
    
    <div id="revenus" class="content active">
        <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.9 3,5V19C3,20.1 3.89,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M19,19H5V5H19V19M7,10H17V12H7V10M7,14H12V16H7V14M7,6H17V8H7V6Z"/></svg>
            <p>Aucun revenu généré pour le moment.</p>
            <small>Achetez un panneau VIP pour commencer à gagner.</small>
        </div>
    </div>

    <div id="retraits" class="content">
        <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4M11,7V12.41L15.29,16.71L16.71,15.29L13,11.59V7H11Z"/></svg>
            <p>Vous n'avez effectué aucune demande de retrait.</p>
        </div>
    </div>

</div>

<script>
    function openTab(evt, tabName) {
        var i, content, tabs;
        content = document.getElementsByClassName("content");
        for (i = 0; i < content.length; i++) { content[i].classList.remove("active"); }
        tabs = document.getElementsByClassName("tab");
        for (i = 0; i < tabs.length; i++) { tabs[i].classList.remove("active"); }
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }
</script>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item"><span>🏠 Accueil</span></a>
    <a href="shop.html" class="nav-item"><span>☀️ Produits</span></a>
    <a href="equipe.html" class="nav-item"><span>👥 Équipe</span></a>
    <a href="profil.html" class="nav-item"><span>👤 Profil</span></a>
</nav>

</body>
</html>
