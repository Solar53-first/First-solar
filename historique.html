<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Historique</title>
    <style>
        :root {
            --primary: #f39c12;
            --dark-bg: rgba(0, 0, 0, 0.9);
            --glass: rgba(255, 255, 255, 0.05);
            --success: #2ecc71;
            --warning: #f1c40f;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white; padding-bottom: 80px;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); z-index: -1;
        }

        header {
            background: var(--dark-bg); padding: 15px;
            text-align: center; border-bottom: 2px solid var(--primary);
        }

        .tabs { display: flex; background: rgba(0,0,0,0.7); sticky: top; }

        .tab {
            flex: 1; padding: 15px 5px; text-align: center;
            cursor: pointer; border-bottom: 3px solid transparent;
            font-size: 0.8em; opacity: 0.6; text-transform: uppercase;
        }

        .tab.active {
            opacity: 1; border-color: var(--primary);
            color: var(--primary); font-weight: bold;
        }

        .container { padding: 15px; }

        .content { display: none; animation: fadeIn 0.4s; }
        .content.active { display: block; }

        /* --- Style des cartes d'historique --- */
        .history-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            border-left: 4px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .details p { margin: 2px 0; font-size: 0.9em; }
        .amount { font-weight: bold; font-size: 1.1em; color: var(--primary); }
        
        .status {
            font-size: 0.75em;
            padding: 4px 8px;
            border-radius: 20px;
            font-weight: bold;
        }

        .status-pending { background: var(--warning); color: #000; }
        .status-success { background: var(--success); color: #fff; }

        .empty-state { text-align: center; padding: 50px 20px; opacity: 0.5; }
        .empty-state svg { width: 50px; height: 50px; fill: var(--primary); margin-bottom: 10px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #111; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid var(--glass);
        }
        .nav-item { color: #666; text-decoration: none; font-size: 0.8em; text-align: center; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="overlay"></div>

<header>
    <h2 style="margin:0; font-size: 1.2em;">MON HISTORIQUE</h2>
</header>

<div class="tabs">
    <div class="tab active" onclick="openTab(event, 'recharges')">📥 Recharges</div>
    <div class="tab" onclick="openTab(event, 'retraits')">📤 Retraits</div>
    <div class="tab" onclick="openTab(event, 'revenus')">📈 Revenus</div>
</div>

<div class="container">
    
    <div id="recharges" class="content active">
        <div id="list-recharges">
            <div class="empty-state"><p>Chargement des recharges...</p></div>
        </div>
    </div>

    <div id="retraits" class="content">
        <div id="list-retraits">
            <div class="empty-state"><p>Chargement des retraits...</p></div>
        </div>
    </div>

    <div id="revenus" class="content">
        <div class="empty-state">
            <svg viewBox="0 0 24 24"><path d="M19,3H5C3.89,3 3,3.9 3,5V19C3,20.1 3.89,21 5,21H19C20.1,21 21,20.1 21,19V5C21,3.9 20.1,3 19,3M19,19H5V5H19V19M7,10H17V12H7V10M7,14H12V16H7V14M7,6H17V8H7V6Z"/></svg>
            <p>Aucun revenu généré.</p>
        </div>
    </div>

</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">🏠 Accueil</a>
    <a href="shop.html" class="nav-item">☀️ Produits</a>
    <a href="equipe.html" class="nav-item">👥 Équipe</a>
    <a href="profil.html" class="nav-item active">👤 Profil</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem("userPhone");

    if (!userPhone) { window.location.href = "login.html"; }

    // --- CHARGER LES RECHARGES ---
    onValue(ref(db, 'demandes_recharge'), (snap) => {
        const list = document.getElementById('list-recharges');
        list.innerHTML = "";
        let count = 0;

        snap.forEach((child) => {
            const d = child.val();
            if (d.telephone == userPhone) {
                count++;
                list.innerHTML += `
                    <div class="history-card">
                        <div class="details">
                            <p>Dépôt via ID: ${d.transactionID || 'Mobile'}</p>
                            <span class="status status-pending">En attente</span>
                        </div>
                        <div class="amount">+${d.montant} FC</div>
                    </div>`;
            }
        });
        if (count === 0) list.innerHTML = '<div class="empty-state"><p>Aucune recharge en cours.</p></div>';
    });

    // --- CHARGER LES RETRAITS ---
    onValue(ref(db, 'demandes_retrait'), (snap) => {
        const list = document.getElementById('list-retraits');
        list.innerHTML = "";
        let count = 0;

        snap.forEach((child) => {
            const d = child.val();
            if (d.telephone == userPhone) {
                count++;
                list.innerHTML += `
                    <div class="history-card" style="border-left-color: #e74c3c;">
                        <div class="details">
                            <p>Retrait vers ${d.numero_retrait}</p>
                            <span class="status status-pending">En attente</span>
                        </div>
                        <div class="amount">-${d.montant} FC</div>
                    </div>`;
            }
        });
        if (count === 0) list.innerHTML = '<div class="empty-state"><p>Aucun retrait en attente.<br><small>Si validé, il disparaît de cette liste.</small></p></div>';
    });

</script>

<script>
    function openTab(evt, tabName) {
        var i, content, tabs;
        content = document.getElementsByClassName("content");
        for (i = 0; i < content.length; i++) { content[i].classList.remove("active"); }
        tabs = document.getElementsByClassName("tab");
        for (i = 0; i < tabs.length; i++) { tabs[i].classList.remove("active"); }
        document.getElementById(tabName).classList.add("active");
        evt.currentTarget.classList.add("active");
    }
</script>

</body>
</html>
