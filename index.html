<script type="module">

// 🔥 Firebase
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

// ⚠️ METS TES VRAIES INFOS FIREBASE ICI
const firebaseConfig = {
  apiKey: "VOTRE_API_KEY",
  authDomain: "VOTRE_PROJET.firebaseapp.com",
  projectId: "VOTRE_PROJET",
  storageBucket: "VOTRE_PROJET.appspot.com",
  messagingSenderId: "XXXX",
  appId: "XXXX"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// 🔥 Lire ?ref= dans l’URL
const urlParams = new URLSearchParams(window.location.search);
const refFromUrl = urlParams.get("ref");

const inputs = document.querySelectorAll("input");
const phoneInput = inputs[0];
const passwordInput = inputs[1];
const referralInput = inputs[2];

// Remplir automatiquement si lien de parrainage
if (refFromUrl) {
    referralInput.value = refFromUrl;
}

// 🔥 Générer code unique
function generateReferralCode() {
    return "SOLAR-" + Date.now().toString().slice(-6);
}

document.getElementById("registerForm").addEventListener("submit", async function(e) {
    e.preventDefault();

    const phone = phoneInput.value.trim();
    const password = passwordInput.value.trim();
    const referredBy = referralInput.value.trim();

    if (!phone || !password) {
        alert("Veuillez remplir tous les champs obligatoires.");
        return;
    }

    const myCode = generateReferralCode();

    // 🔥 Vérifier si le parrain existe
    let parrainDoc = null;

    if (referredBy) {
        const q = query(collection(db, "users"), where("referralCode", "==", referredBy));
        const querySnapshot = await getDocs(q);

        if (!querySnapshot.empty) {
            parrainDoc = querySnapshot.docs[0];
        } else {
            alert("Code de parrain invalide.");
            return;
        }
    }

    // 🔥 Créer nouvel utilisateur
    await addDoc(collection(db, "users"), {
        phone: phone,
        password: password,
        referralCode: myCode,
        referredBy: referredBy || null,
        level1Count: 0,
        commission: 0,
        createdAt: new Date()
    });

    // 🔥 Si parrain existe → augmenter son niveau 1 + commission
    if (parrainDoc) {
        await updateDoc(parrainDoc.ref, {
            level1Count: increment(1),
            commission: increment(1000) // 💰 Commission niveau 1 (modifiable)
        });
    }

    alert("Inscription réussie !");
    window.location.href = "login.html";
});

</script>
