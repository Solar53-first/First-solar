<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Inscription</title>
    <style>
        :root { --primary-color: #f39c12; --dark-bg: rgba(0, 0, 0, 0.8); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; overflow: hidden; }
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1; }
        .auth-container { position: relative; z-index: 2; background: var(--dark-bg); padding: 35px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7); width: 90%; max-width: 380px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); }
        h1 { color: var(--primary-color); margin-bottom: 5px; font-size: 2.2em; letter-spacing: 2px; text-transform: uppercase; }
        .tagline { font-size: 0.9em; margin-bottom: 25px; opacity: 0.8; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: var(--primary-color); }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255, 255, 255, 0.1); color: white; box-sizing: border-box; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary-color); border: none; color: black; font-weight: bold; font-size: 1em; border-radius: 8px; cursor: pointer; transition: all 0.3s ease; margin-top: 15px; text-transform: uppercase; }
        .btn-submit:hover { background: #ffb433; transform: translateY(-2px); }
        .footer-link { margin-top: 20px; font-size: 0.9em; }
        .footer-link a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="auth-container">
    <h1>FIRST SOLAR</h1>
    <p class="tagline">L'énergie du futur entre vos mains</p>
    <form id="registerForm">
        <div class="input-group">
            <label>Numéro de téléphone</label>
            <input type="text" id="phone" placeholder="Ex: +243812345678" required>
        </div>
        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="6 chiffres" maxlength="6" required>
        </div>
        <div class="input-group">
            <label>Code d'invitation</label>
            <input type="text" id="inviteCode" placeholder="Code parrain">
        </div>
        <button type="submit" class="btn-submit">Créer mon compte</button>
    </form>
    <div class="footer-link">Déjà membre ? <a href="login.html">Se connecter ici</a></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();
        const inviteCode = document.getElementById('inviteCode').value.trim() || "SYSTEM";
        
        const cleanPhone = phone.replace(/\+/g, '');

        if (!phone.startsWith("+243") || phone.length !== 13) {
            alert("Format requis: +243 suivi de 9 chiffres.");
            return;
        }

        try {
            const userRef = ref(db, 'users/' + cleanPhone);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                alert("Ce numéro est déjà inscrit.");
                return;
            }

            const monCodeUnique = "SOLAR-" + cleanPhone.slice(-5);
            await set(userRef, {
                telephone: phone,
                motDePasse: password,
                mon_code_invitation: monCodeUnique,
                parrain_direct: inviteCode,
                solde: 0,
                revenu_total: 0,
                date_inscription: new Date().toISOString(),
                last_income_timestamp: 0
            });

            alert("Inscription réussie !");
            window.location.href = "login.html";
        } catch (error) {
            alert("Erreur serveur : " + error.message);
        }
    });
</script>
</body>
</html>
