<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Connexion</title>
    <style>
        :root { --primary: #f39c12; --bg: rgba(0,0,0,0.9); }
        body { margin: 0; font-family: sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .container { position: relative; z-index: 2; background: var(--bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; border: 1px solid var(--primary); backdrop-filter: blur(10px); }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #444; background: #222; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; background: var(--primary); border: none; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; }
        .footer { margin-top: 15px; font-size: 0.8em; }
        .footer a { color: var(--primary); text-decoration: none; }
        #refMessage { color: #27ae60; font-size: 0.85em; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>FIRST SOLAR</h1>
        <p>Connexion à votre espace</p>
        <div id="refMessage"></div>
        <form id="loginForm">
            <input type="text" id="phone" placeholder="+243XXXXXXXXX" maxlength="13" required>
            <input type="password" id="password" placeholder="Mot de passe (6 chiffres)" maxlength="6" required>
            <button type="submit" class="btn">SE CONNECTER / S'INSCRIRE</button>
        </form>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // N'OUBLIE PAS DE METTRE TES CLÉS ICI
        const firebaseConfig = {
            apiKey: "VOTRE_API_KEY",
            authDomain: "votre-projet.firebaseapp.com",
            projectId: "votre-projet",
            storageBucket: "votre-projet.appspot.com",
            messagingSenderId: "123456789",
            appId: "VOTRE_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Lecture du code de parrainage dans l'URL
        const urlParams = new URLSearchParams(window.location.search);
        const codeParrain = urlParams.get('ref');
        if(codeParrain) {
            document.getElementById('refMessage').innerText = "🎁 Invité par : " + codeParrain;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value;

            // 1. VÉRIFICATION STRICTE DU NUMÉRO RDC (+243 suivi de 9 chiffres = 13 caractères)
            const phoneRegex = /^\+243\d{9}$/;
            if (!phoneRegex.test(phone)) {
                alert("ERREUR : Le numéro doit commencer par +243 et contenir exactement 9 chiffres ensuite (ex: +243812345678).");
                return;
            }

            // 2. VÉRIFICATION STRICTE DU MOT DE PASSE (Exactement 6 chiffres)
            const passRegex = /^\d{6}$/;
            if (!passRegex.test(password)) {
                alert("ERREUR : Le mot de passe doit contenir exactement 6 chiffres.");
                return;
            }

            try {
                const userRef = doc(db, "users", phone);
                const userSnap = await getDoc(userRef);

                if (userSnap.exists()) {
                    // CONNEXION
                    if (userSnap.data().motDePasse === password) {
                        localStorage.setItem('userPhone', phone);
                        window.location.href = "dashboard.html";
                    } else {
                        alert("Mot de passe incorrect.");
                    }
                } else {
                    // INSCRIPTION AUTOMATIQUE AVEC STRUCTURE DE NIVEAUX
                    const userData = {
                        telephone: phone,
                        motDePasse: password,
                        solde: 0,
                        commissions_recues: 0,
                        parrain_direct: codeParrain || null, // Celui qui a donné le lien (Niveau 1)
                        mon_code_invitation: "SOLAR-" + phone.slice(-6), // Génère un code unique basé sur la fin du numéro
                        date_inscription: new Date().toISOString()
                    };
                    await setDoc(userRef, userData);
                    localStorage.setItem('userPhone', phone);
                    alert("Compte créé avec succès !");
                    window.location.href = "dashboard.html";
                }
            } catch (err) {
                console.error(err);
                alert("Erreur de connexion au serveur.");
            }
        });
    </script>
</body>
</html>
