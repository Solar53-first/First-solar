<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Inscription</title>
    <style>
        :root { --primary-color: #f39c12; --dark-bg: rgba(0, 0, 0, 0.8); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: white; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: 1; }
        .auth-container { position: relative; z-index: 2; background: var(--dark-bg); padding: 30px; border-radius: 20px; width: 90%; max-width: 380px; text-align: center; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(5px); }
        h1 { color: var(--primary-color); margin-bottom: 5px; text-transform: uppercase; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 0.85em; color: var(--primary-color); }
        input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255, 255, 255, 0.1); color: white; box-sizing: border-box; outline: none; }
        .btn-submit { width: 100%; padding: 15px; background: var(--primary-color); border: none; color: black; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 10px; width: 100%; }
        .footer-link { margin-top: 20px; font-size: 0.9em; }
        .footer-link a { color: var(--primary-color); text-decoration: none; }
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="auth-container">
    <h1>FIRST SOLAR</h1>
    <p>Créer un compte</p>
    <form id="registerForm">
        <div class="input-group">
            <label>Téléphone (+243...)</label>
            <input type="text" id="phone" placeholder="+243XXXXXXXXX" required>
        </div>
        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" id="password" maxlength="6" required>
        </div>
        <div class="input-group">
            <label>Code Parrain</label>
            <input type="text" id="inviteCode">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">S'INSCRIRE</button>
    </form>
    <div class="footer-link">Déjà inscrit ? <a href="login.html">Connexion</a></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Détection du parrain
    const urlParams = new URLSearchParams(window.location.search);
    const refCode = urlParams.get('ref');
    if (refCode) {
        document.getElementById('inviteCode').value = refCode;
        document.getElementById('inviteCode').readOnly = true;
    }

    document.getElementById("registerForm").onsubmit = async (e) => {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Chargement...";

        const phone = document.getElementById('phone').value.trim().replace(/\+/g, '').replace(/\s/g, '');
        const password = document.getElementById('password').value;
        const invite = document.getElementById('inviteCode').value || "SYSTEM";

        try {
            const userRef = ref(db, 'users/' + phone);
            const snap = await get(userRef);

            if (snap.exists()) {
                alert("Numéro déjà utilisé.");
                btn.disabled = false;
                btn.innerText = "S'INSCRIRE";
                return;
            }

            const monCode = "SOLAR-" + phone.slice(-5);
            await set(userRef, {
                telephone: phone,
                motDePasse: password,
                mon_code_invitation: monCode,
                parrain_direct: invite,
                solde: 0,
                commissions: 0,
                gain_quotidien_actif: 0,
                date_inscription: new Date().toISOString(),
                last_income_timestamp: 0
            });

            alert("Bienvenue ! Votre code : " + monCode);
            window.location.href = "login.html";
        } catch (err) {
            alert("Erreur : " + err.message);
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
