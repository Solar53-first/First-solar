<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Inscription</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --dark-bg: rgba(0, 0, 0, 0.8);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
            overflow: hidden;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            background: var(--dark-bg);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
        }

        h1 { 
            color: var(--primary-color); 
            margin-bottom: 5px; 
            font-size: 2.2em;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .tagline {
            font-size: 0.9em;
            margin-bottom: 25px;
            opacity: 0.8;
        }

        .input-group { margin-bottom: 15px; text-align: left; }

        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: var(--primary-color); }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
            outline: none;
        }

        input::placeholder { color: rgba(255,255,255,0.5); }

        input:focus { border-color: var(--primary-color); background: rgba(255, 255, 255, 0.15); }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            border: none;
            color: black;
            font-weight: bold;
            font-size: 1em;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            text-transform: uppercase;
        }

        .btn-submit:hover { 
            background: #ffb433; 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(243, 156, 18, 0.4);
        }

        .footer-link { margin-top: 20px; font-size: 0.9em; }

        .footer-link a { 
            color: var(--primary-color); 
            text-decoration: none; 
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="auth-container">
    <h1>FIRST SOLAR</h1>
    <p class="tagline">L'énergie du futur entre vos mains</p>
    
    <form id="registerForm">
        <div class="input-group">
            <label>Numéro de téléphone</label>
            <input type="text" id="phone" placeholder="Ex: +243812345678" required>
        </div>
        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="6 chiffres exactement" maxlength="6" required>
        </div>
        <div class="input-group">
            <label>Code d'invitation</label>
            <input type="text" id="inviteCode" placeholder="Entrez le code de votre parrain">
        </div>
        
        <button type="submit" class="btn-submit">Créer mon compte</button>
    </form>

    <div class="footer-link">
        Déjà membre ? <a href="login.html">Se connecter ici</a>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc, setDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    // REMPLACE CES INFOS PAR TES CLÉS FIREBASE REELLES
    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        authDomain: "votre-projet.firebaseapp.com",
        projectId: "votre-projet",
        storageBucket: "votre-projet.appspot.com",
        messagingSenderId: "123456789",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Remplissage automatique du code si présent dans l'URL (?ref=SOLAR-XXXX)
    const urlParams = new URLSearchParams(window.location.search);
    const refFromUrl = urlParams.get('ref');
    if(refFromUrl) {
        document.getElementById('inviteCode').value = refFromUrl;
    }

    document.getElementById("registerForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();
        const inviteCode = document.getElementById('inviteCode').value.trim();

        // 1. VERIFICATION NUMERO RDC (+243)
        if (!phone.startsWith("+243") || phone.length !== 13) {
            alert("Erreur : Le numéro doit commencer par +243 et avoir 9 chiffres après (Ex: +243812345678).");
            return;
        }

        // 2. VERIFICATION MOT DE PASSE (6 CHIFFRES)
        if (!/^\d{6}$/.test(password)) {
            alert("Erreur : Le mot de passe doit contenir exactement 6 chiffres.");
            return;
        }

        try {
            // 3. VERIFIER SI L'UTILISATEUR EXISTE DEJA
            const userRef = doc(db, "users", phone);
            const userSnap = await getDoc(userRef);

            if (userSnap.exists()) {
                alert("Ce numéro est déjà inscrit. Connectez-vous.");
                window.location.href = "login.html";
                return;
            }

            // 4. GENERATION DU CODE D'INVITATION UNIQUE
            const monCodeUnique = "SOLAR-" + phone.slice(-6);

            // 5. ENREGISTREMENT DU NOUVEL UTILISATEUR
            await setDoc(userRef, {
                telephone: phone,
                motDePasse: password,
                mon_code_invitation: monCodeUnique,
                parrain_direct: inviteCode || "SYSTEM",
                solde: 0,
                commissions_totale: 0,
                date_inscription: new Date().toISOString()
            });

            alert("Compte créé avec succès ! Bienvenue chez First Solar.");
            localStorage.setItem('userPhone', phone);
            window.location.href = "login.html";

        } catch (error) {
            console.error(error);
            alert("Une erreur est survenue lors de l'inscription.");
        }
    });
</script>

</body>
</html>
