<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Connexion</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --dark-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            background: var(--dark-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; font-size: 2em; text-transform: uppercase; }
        .tagline { font-size: 0.9em; margin-bottom: 30px; opacity: 0.8; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: var(--primary-color); }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-login:hover { background: #ffb433; transform: scale(1.02); }
        .footer-link { margin-top: 25px; font-size: 0.9em; }
        .footer-link a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="auth-container">
    <h1>FIRST SOLAR</h1>
    <p class="tagline">Connectez-vous à votre espace solaire</p>
    
    <form id="loginForm">
        <div class="input-group">
            <label>Numéro de téléphone</label>
            <input type="text" id="phone" placeholder="+243XXXXXXXXX" required>
        </div>
        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" id="password" placeholder="6 chiffres" required>
        </div>
        
        <button type="submit" class="btn-login">SE CONNECTER</button>
    </form>

    <div class="footer-link">
        Pas encore de compte ? <a href="index.html">Créer un compte</a>
    </div>
</div>

<script type="module">
    // 1. IMPORTATION POUR REALTIME DATABASE
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // 2. CONFIGURATION (Prends bien ton databaseURL de l'Image 4)
    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    document.getElementById("loginForm").addEventListener("submit", async function(e) {
        e.preventDefault();
        
        const phone = document.getElementById('phone').value.trim();
        const password = document.getElementById('password').value.trim();

        // Nettoyage du numéro pour correspondre à la base (ex: 243975617195)
        const cleanPhone = phone.replace(/\D/g, '');

        try {
            // 3. RECHERCHE DANS REALTIME DATABASE
            const userRef = ref(db, 'users/' + cleanPhone);
            const snapshot = await get(userRef);

            if (snapshot.exists()) {
                const userData = snapshot.val();
                
                // Vérification du mot de passe
                if (userData.motDePasse === password) {
                    localStorage.setItem('userPhone', cleanPhone);
                    window.location.href = "dashboard.html";
                } else {
                    alert("Mot de passe incorrect.");
                }
            } else {
                alert("Ce compte n'existe pas ou numéro mal saisi.");
            }
        } catch (error) {
            console.error(error);
            alert("Erreur de connexion : " + error.message);
        }
    });
</script>

</body>
</html>
