<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Tableau de Bord</title>

    <style>
        :root {
            --primary: #f39c12;
            --dark-card: rgba(0, 0, 0, 0.8);
            --glass: rgba(255, 255, 255, 0.1);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            padding-bottom: 80px;
        }

        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: -1;
        }

        .container { padding: 20px; }

        .balance-card {
            background: linear-gradient(135deg, var(--primary), #e67e22);
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            margin-bottom: 20px;
            color: #000;
        }

        .balance-card h2 { margin: 0; font-size: 0.9em; text-transform: uppercase; opacity: 0.8; }
        .balance-amount { font-size: 2.2em; font-weight: bold; margin: 10px 0; }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .btn-action {
            padding: 15px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            font-size: 1em;
            transition: 0.3s;
        }

        .recharge { background: #27ae60; color: white; }
        .retrait { background: white; color: #000; }

        .about-section {
            background: var(--dark-card);
            padding: 20px;
            border-radius: 15px;
            border: 1px solid var(--glass);
            line-height: 1.6;
            backdrop-filter: blur(10px);
        }

        .about-section h3 { color: var(--primary); margin-top: 0; }
        .about-section p { font-size: 0.95em; color: #ddd; text-align: justify; }

        .logout-btn {
            margin-top:15px;
            background:red;
            color:white;
            padding:10px;
            border:none;
            border-radius:8px;
            cursor:pointer;
            width:100%;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #111;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid var(--glass);
            z-index: 100;
        }

        .nav-item {
            text-align: center;
            color: #888;
            text-decoration: none;
            font-size: 0.8em;
        }

        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="container">
    <p style="margin-bottom: 5px; opacity: 0.8;">Bienvenue,</p>
    <h3 id="userPhone">Chargement...</h3>

    <div class="balance-card">
        <h2>Solde Total</h2>
        <div class="balance-amount" id="balance">0.00 CDF</div>
        <p style="margin: 0; font-size: 0.8em;" id="dailyIncome">
            Revenus cumulés aujourd'hui : 0 CDF
        </p>
    </div>

    <div class="action-grid">
        <a href="recharge.html" class="btn-action recharge">📥 Recharger</a>
        <a href="retrait.html" class="btn-action retrait">📤 Retrait</a>
    </div>

    <button class="logout-btn" id="logout">Se déconnecter</button>

</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">
        <span>🏠 Accueil</span>
    </a>
    <a href="shop.html" class="nav-item">
        <span>☀️ Produits</span>
    </a>
    <a href="equipe.html" class="nav-item">
        <span>👥 Équipe</span>
    </a>
    <a href="profil.html" class="nav-item">
        <span>👤 Profil</span>
    </a>
</nav>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    authDomain: "VOTRE_AUTH_DOMAIN",
    projectId: "VOTRE_PROJECT_ID",
    storageBucket: "VOTRE_BUCKET",
    messagingSenderId: "VOTRE_ID",
    appId: "VOTRE_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

onAuthStateChanged(auth, async (user) => {
    if (user) {

        document.getElementById("userPhone").innerText = user.phoneNumber || user.email;

        const userRef = doc(db, "users", user.uid);
        const userSnap = await getDoc(userRef);

        if (userSnap.exists()) {
            const data = userSnap.data();
            document.getElementById("balance").innerText =
                (data.balance || 0) + " CDF";
            document.getElementById("dailyIncome").innerText =
                "Revenus cumulés aujourd'hui : " + (data.dailyIncome || 0) + " CDF";
        }

    } else {
        window.location.href = "login.html";
    }
});

document.getElementById("logout").addEventListener("click", async () => {
    await signOut(auth);
    window.location.href = "login.html";
});

</script>

</body>
</html>
