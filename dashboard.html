<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Dashboard</title>
    <style>
        :root { --primary: #f39c12; --dark-card: rgba(0, 0, 0, 0.8); --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; color: white; padding-bottom: 80px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); z-index: -1; }
        .container { padding: 20px; }
        .balance-card { background: linear-gradient(135deg, var(--primary), #e67e22); padding: 25px; border-radius: 20px; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.3); margin-bottom: 20px; color: #000; }
        .balance-amount { font-size: 2.2em; font-weight: bold; margin: 10px 0; }
        .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 25px; }
        .btn-action { padding: 15px; border-radius: 12px; border: none; font-weight: bold; cursor: pointer; text-align: center; text-decoration: none; font-size: 1em; transition: 0.3s; }
        .recharge { background: #27ae60; color: white; }
        .retrait { background: white; color: #000; }
        
        /* Style de l'animation des images */
        .animated-banner { width: 100%; height: 180px; border-radius: 15px; margin-bottom: 20px; overflow: hidden; position: relative; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .animated-banner img { width: 100%; height: 100%; object-fit: cover; position: absolute; opacity: 0; transition: opacity 1s ease-in-out; }
        .animated-banner img.active { opacity: 1; }

        .about-section { background: var(--dark-card); padding: 20px; border-radius: 15px; border: 1px solid var(--glass); line-height: 1.6; backdrop-filter: blur(10px); }
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass); z-index: 100; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 0.8em; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>
<div class="overlay"></div>
<div class="container">
    <p>Bienvenue chez First Solar,</p>
    <h3 id="userDisplay">Membre Solaire...</h3>
    <div class="balance-card">
        <h2>Solde Total</h2>
        <div id="soldeAffiche" class="balance-amount">0 CDF</div>
        <p id="dailyIncomeDisplay" style="margin: 0; font-size: 0.8em;">Gains du jour : 0 CDF</p>
    </div>
    <div class="action-grid">
        <a href="recharge.html" class="btn-action recharge">📥 Recharger</a>
        <a href="retrait.html" class="btn-action retrait">📤 Retrait</a>
    </div>

    <div class="animated-banner">
        <img src="IMG_3041.jpeg" class="active">
        <img src="IMG_3042.jpeg">
    </div>

    <div class="about-section">
        <h3>Notre Vision : Éclairer l'Avenir</h3>
        <p>First Solar permet à chaque citoyen de devenir un acteur majeur de la transition écologique...</p>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item active">🏠 Accueil</a>
    <a href="shop.html" class="nav-item">☀️ Produits</a>
    <a href="equipe.html" class="nav-item">👥 Équipe</a>
    <a href="profil.html" class="nav-item">👤 Profil</a>
</nav>

<script>
    // Logique pour faire changer les deux images
    const slides = document.querySelectorAll('.animated-banner img');
    let currentSlide = 0;
    setInterval(() => {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + 1) % slides.length;
        slides[currentSlide].classList.add('active');
    }, 3000); // Change toutes les 3 secondes
</script>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const userPhone = localStorage.getItem("userPhone");

    if (!userPhone) {
        window.location.href = "login.html";
    } else {
        const userRef = ref(db, 'users/' + userPhone);
        onValue(userRef, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                document.getElementById('userDisplay').innerText = "Membre : +" + data.telephone;
                document.getElementById('soldeAffiche').innerText = (data.solde || 0).toLocaleString() + " CDF";
                
                const now = new Date().getTime();
                const lastIncome = data.last_income_timestamp || 0;
                const gainParJour = data.gain_quotidien_actif || 0;

                if (gainParJour > 0 && (now - lastIncome) >= 86400000) {
                    const nouveauSolde = (data.solde || 0) + gainParJour;
                    update(userRef, {
                        solde: nouveauSolde,
                        last_income_timestamp: now
                    });
                    alert("Votre gain quotidien de " + gainParJour + " CDF a été ajouté !");
                }
            }
        });
    }
</script>
</body>
</html>
