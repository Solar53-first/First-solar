<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Mon Équipe</title>
    <style>
        :root { --primary: #f39c12; --dark-card: rgba(0, 0, 0, 0.85); --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; color: white; padding-bottom: 90px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }
        .container { padding: 20px; }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--dark-card); padding: 15px; border-radius: 15px; border: 1px solid var(--glass); text-align: center; }
        .stat-card h4 { margin: 0; font-size: 0.8em; opacity: 0.7; }
        .stat-card p { margin: 5px 0 0; font-size: 1.2em; font-weight: bold; color: var(--primary); }

        .invite-box { background: var(--dark-card); padding: 20px; border-radius: 15px; border: 1px solid var(--primary); margin-bottom: 20px; text-align: center; }
        .code-display { font-size: 1.5em; font-weight: bold; color: var(--primary); margin: 10px 0; letter-spacing: 2px; }
        .btn-copy { background: var(--primary); color: black; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 5px; }

        .tabs { display: flex; justify-content: space-around; background: var(--dark-card); border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--glass); }
        .tab { padding: 12px; cursor: pointer; font-size: 0.9em; opacity: 0.6; transition: 0.3s; flex: 1; text-align: center; }
        .tab.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }

        .member-list { background: var(--dark-card); border-radius: 15px; padding: 10px; min-height: 200px; border: 1px solid var(--glass); }
        .member-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--glass); font-size: 0.9em; }
        .member-item:last-child { border-bottom: none; }
        .no-data { text-align: center; padding: 40px; opacity: 0.5; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass); z-index: 100; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 0.8em; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="container">
    <h2 style="color: var(--primary);">Mon Réseau Solaire</h2>
    
    <div class="invite-box">
        <p style="margin:0; font-size: 0.9em;">Votre Code d'Invitation</p>
        <div class="code-display" id="myCodeDisplay">...</div>
        <button class="btn-copy" id="copyBtn">Copier le Lien de Parrainage</button>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h4>Taille Équipe</h4>
            <p id="totalTeam">0</p>
        </div>
        <div class="stat-card">
            <h4>Commissions</h4>
            <p id="totalGains">0 CDF</p>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" id="tab1" onclick="switchLevel(1)">Niv 1 (0)</div>
        <div class="tab" id="tab2" onclick="switchLevel(2)">Niv 2 (0)</div>
        <div class="tab" id="tab3" onclick="switchLevel(3)">Niv 3 (0)</div>
    </div>

    <div class="member-list" id="memberContainer">
        <div class="no-data">Analyse du réseau...</div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">🏠 Accueil</a>
    <a href="shop.html" class="nav-item">☀️ Produits</a>
    <a href="equipe.html" class="nav-item active">👥 Équipe</a>
    <a href="profil.html" class="nav-item">👤 Profil</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
        projectId: "firstsolar-e2ba3",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    
    // Nettoyage du numéro pour correspondre à la base
    const userPhone = localStorage.getItem('userPhone') ? localStorage.getItem('userPhone').replace(/\D/g, '') : null;

    if (!userPhone) window.location.href = "login.html";

    let network = { lv1: [], lv2: [], lv3: [] };
    let myInviteCode = "";

    async function loadNetwork() {
        try {
            const selfRef = ref(db, 'users/' + userPhone);
            const selfSnap = await get(selfRef);
            if (!selfSnap.exists()) return;
            
            const userData = selfSnap.val();
            myInviteCode = userData.mon_code_invitation;
            document.getElementById('myCodeDisplay').innerText = myInviteCode;
            document.getElementById('totalGains').innerText = (userData.commissions || 0).toLocaleString() + " CDF";

            const allUsersRef = ref(db, 'users');
            const allSnap = await get(allUsersRef);
            if (!allSnap.exists()) return;
            const allUsers = allSnap.val();

            // Calcul des Niveaux
            for (let id in allUsers) {
                if (allUsers[id].parrain_direct === myInviteCode) {
                    network.lv1.push(allUsers[id]);
                }
            }

            network.lv1.forEach(f1 => {
                for (let id in allUsers) {
                    if (allUsers[id].parrain_direct === f1.mon_code_invitation) {
                        network.lv2.push(allUsers[id]);
                    }
                }
            });

            network.lv2.forEach(f2 => {
                for (let id in allUsers) {
                    if (allUsers[id].parrain_direct === f2.mon_code_invitation) {
                        network.lv3.push(allUsers[id]);
                    }
                }
            });

            document.getElementById('tab1').innerText = `Niv 1 (${network.lv1.length})`;
            document.getElementById('tab2').innerText = `Niv 2 (${network.lv2.length})`;
            document.getElementById('tab3').innerText = `Niv 3 (${network.lv3.length})`;
            document.getElementById('totalTeam').innerText = network.lv1.length + network.lv2.length + network.lv3.length;

            updateUI(1);

        } catch (error) {
            console.error("Erreur réseau:", error);
        }
    }

    // --- CORRECTION DU LIEN DE PARRAINAGE ---
    document.getElementById('copyBtn').onclick = () => {
        // Cette ligne force l'URL à inclure le dossier First-solar
        const domain = "https://solar53-first.github.io/First-solar/";
        const fullLink = `${domain}index.html?ref=${myInviteCode}`;
        
        navigator.clipboard.writeText(fullLink).then(() => {
            alert("Lien copié avec succès ! Envoyez-le à vos amis.");
        }).catch(err => {
            // Méthode de secours si navigator.clipboard échoue
            const textArea = document.createElement("textarea");
            textArea.value = fullLink;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand("copy");
            document.body.removeChild(textArea);
            alert("Lien copié !");
        });
    };

    window.switchLevel = (lvl) => {
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', i === (lvl-1));
        });
        updateUI(lvl);
    };

    function updateUI(lvl) {
        const container = document.getElementById('memberContainer');
        const list = network['lv' + lvl];
        container.innerHTML = "";

        if(list.length === 0) {
            container.innerHTML = '<div class="no-data">Aucun membre à ce niveau</div>';
            return;
        }

        list.forEach(m => {
            const telCache = m.telephone ? m.telephone.substring(0,7) + "***" : "Inconnu";
            const date = m.date_inscription ? new Date(m.date_inscription).toLocaleDateString() : "---";
            container.innerHTML += `
                <div class="member-item">
                    <span>📱 ${telCache}</span>
                    <span style="color:#27ae60;">${date}</span>
                </div>
            `;
        });
    }

    loadNetwork();
</script>
</body>
</html>
