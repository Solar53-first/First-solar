<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Mon Équipe</title>
    <style>
        :root { --primary: #f39c12; --dark-card: rgba(0, 0, 0, 0.85); --glass: rgba(255, 255, 255, 0.1); }
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; background: url('IMG_2991.jpeg') no-repeat center center fixed; background-size: cover; color: white; padding-bottom: 90px; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.6); z-index: -1; }
        .container { padding: 20px; }
        
        /* Stats d'équipe */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .stat-card { background: var(--dark-card); padding: 15px; border-radius: 15px; border: 1px solid var(--glass); text-align: center; }
        .stat-card h4 { margin: 0; font-size: 0.8em; opacity: 0.7; }
        .stat-card p { margin: 5px 0 0; font-size: 1.2em; font-weight: bold; color: var(--primary); }

        /* Onglets Niveaux */
        .tabs { display: flex; justify-content: space-around; background: var(--dark-card); border-radius: 10px; margin-bottom: 20px; border: 1px solid var(--glass); }
        .tab { padding: 12px; cursor: pointer; font-size: 0.9em; opacity: 0.6; transition: 0.3s; }
        .tab.active { opacity: 1; color: var(--primary); border-bottom: 2px solid var(--primary); }

        /* Liste des membres */
        .member-list { background: var(--dark-card); border-radius: 15px; padding: 10px; min-height: 200px; border: 1px solid var(--glass); }
        .member-item { display: flex; justify-content: space-between; padding: 12px; border-bottom: 1px solid var(--glass); font-size: 0.9em; }
        .member-item:last-child { border-bottom: none; }
        .no-data { text-align: center; padding: 40px; opacity: 0.5; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #111; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--glass); z-index: 100; }
        .nav-item { text-align: center; color: #888; text-decoration: none; font-size: 0.8em; }
        .nav-item.active { color: var(--primary); }
    </style>
</head>
<body>

<div class="overlay"></div>

<div class="container">
    <h2 style="color: var(--primary);">Mon Réseau Solaire</h2>
    
    <div class="stats-grid">
        <div class="stat-card">
            <h4>Taille Équipe</h4>
            <p id="totalTeam">0</p>
        </div>
        <div class="stat-card">
            <h4>Gains Totaux</h4>
            <p id="totalGains">0 CDF</p>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="switchLevel(1)">Niveau 1</div>
        <div class="tab" onclick="switchLevel(2)">Niveau 2</div>
        <div class="tab" onclick="switchLevel(3)">Niveau 3</div>
    </div>

    <div class="member-list" id="memberContainer">
        <div class="no-data">Chargement du réseau...</div>
    </div>
</div>

<nav class="bottom-nav">
    <a href="dashboard.html" class="nav-item">🏠 Accueil</a>
    <a href="shop.html" class="nav-item">☀️ Produits</a>
    <a href="equipe.html" class="nav-item active">👥 Équipe</a>
    <a href="profil.html" class="nav-item">👤 Profil</a>
</nav>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "VOTRE_API_KEY",
        authDomain: "votre-projet.firebaseapp.com",
        projectId: "votre-projet",
        storageBucket: "votre-projet.appspot.com",
        messagingSenderId: "123456789",
        appId: "VOTRE_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const userPhone = localStorage.getItem('userPhone');
    if (!userPhone) window.location.href = "index.html";

    let network = { lv1: [], lv2: [], lv3: [] };

    async function loadNetwork() {
        // Obtenir son propre code d'invitation d'abord
        const usersRef = collection(db, "users");
        
        // NIVEAU 1 : Chercher ceux dont le parrain est MON code
        // Note: On suppose que 'mon_code_invitation' est stocké dans le profil
        const q1 = query(usersRef, where("parrain_direct", "==", "SOLAR-" + userPhone.slice(-6)));
        const snap1 = await getDocs(q1);
        snap1.forEach(doc => network.lv1.push(doc.data()));

        // NIVEAU 2 : Pour chaque membre du LV1, chercher leurs filleuls
        for(let f1 of network.lv1) {
            const q2 = query(usersRef, where("parrain_direct", "==", f1.mon_code_invitation));
            const snap2 = await getDocs(q2);
            snap2.forEach(doc => network.lv2.push(doc.data()));
        }

        // NIVEAU 3 : Pour chaque membre du LV2, chercher leurs filleuls
        for(let f2 of network.lv2) {
            const q3 = query(usersRef, where("parrain_direct", "==", f2.mon_code_invitation));
            const snap3 = await getDocs(q3);
            snap3.forEach(doc => network.lv3.push(doc.data()));
        }

        updateUI(1);
        document.getElementById('totalTeam').innerText = network.lv1.length + network.lv2.length + network.lv3.length;
    }

    window.switchLevel = (lvl) => {
        document.querySelectorAll('.tab').forEach((t, i) => {
            t.classList.toggle('active', i === (lvl-1));
        });
        updateUI(lvl);
    };

    function updateUI(lvl) {
        const container = document.getElementById('memberContainer');
        const list = network['lv' + lvl];
        container.innerHTML = "";

        if(list.length === 0) {
            container.innerHTML = '<div class="no-data">Aucun membre à ce niveau</div>';
            return;
        }

        list.forEach(m => {
            container.innerHTML += `
                <div class="member-item">
                    <span>📱 ${m.telephone.substring(0,7)}****</span>
                    <span style="color:#27ae60;">Inscrit le ${new Date(m.date_inscription).toLocaleDateString()}</span>
                </div>
            `;
        });
    }

    loadNetwork();
</script>
</body>
</html>
