<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Solar - Retrait</title>
    <style>
        :root {
            --primary: #f39c12;
            --dark-bg: rgba(0, 0, 0, 0.9);
            --glass: rgba(255, 255, 255, 0.1);
            --danger: #e74c3c;
            --success: #27ae60;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', sans-serif;
            background: url('IMG_2991.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white; padding-bottom: 90px;
        }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); z-index: -1;
        }

        header {
            background: var(--dark-bg); padding: 20px;
            text-align: center; border-bottom: 2px solid var(--primary);
        }

        .container { padding: 20px; }

        .withdraw-card {
            background: var(--dark-bg);
            padding: 20px; border-radius: 15px;
            border: 1px solid var(--glass);
            backdrop-filter: blur(10px);
        }

        .info-box {
            background: rgba(243, 156, 18, 0.1);
            padding: 10px; border-radius: 8px;
            font-size: 0.85em; border-left: 4px solid var(--primary);
            margin-bottom: 20px;
        }

        .input-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.9em; margin-bottom: 5px; color: var(--primary); }
        
        input {
            width: 100%; padding: 12px; border-radius: 8px;
            border: 1px solid var(--glass); background: rgba(255,255,255,0.05);
            color: white; box-sizing: border-box; font-size: 1.1em;
        }

        .calc-box {
            margin: 15px 0; font-size: 0.9em;
            background: rgba(0,0,0,0.4); padding: 10px; border-radius: 8px;
        }

        .btn-withdraw {
            width: 100%; padding: 15px; background: var(--primary);
            border: none; border-radius: 8px; font-weight: bold;
            cursor: pointer; font-size: 1em; text-transform: uppercase;
            transition: 0.3s;
        }

        /* Le bouton devient vert quand il est prêt */
        .btn-withdraw:not(:disabled) {
            background: var(--success);
            box-shadow: 0 0 15px rgba(39, 174, 96, 0.5);
        }

        .btn-withdraw:disabled {
            background: #555; cursor: not-allowed;
        }

        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #111; display: flex; justify-content: space-around;
            padding: 15px 0; border-top: 1px solid var(--glass);
        }
        .nav-item { color: #666; text-decoration: none; font-size: 0.8em; text-align: center; }
    </style>
</head>
<body>

<div class="overlay"></div>

<header>
    <h2 style="margin:0;">RETRAIT DE FONDS</h2>
</header>

<div class="container">
    
    <div class="withdraw-card">
        <div class="info-box">
            • Minimum : <b>6 000 CDF</b><br>
            • Frais : <b>15%</b><br>
            • Limite : <b>1 retrait maximum par jour</b><br>
            • Heures : <b>11:00 - 16:00</b> chaque jour.
        </div>

        <div class="input-group">
            <label>Numéro de réception (M-Pesa/Orange/Airtel)</label>
            <input type="text" id="phoneWithdraw" placeholder="08XXXXXXXX">
        </div>

        <div class="input-group">
            <label>Montant à retirer (CDF)</label>
            <input type="number" id="amount" placeholder="Minimum 6000" oninput="calculate()">
        </div>

        <div class="calc-box">
            <div style="display:flex; justify-content: space-between;">
                <span>Frais de service (15%) :</span>
                <span id="fees">0 CDF</span>
            </div>
            <div style="display:flex; justify-content: space-between; margin-top:5px; font-weight:bold; color:var(--primary);">
                <span>Vous recevrez :</span>
                <span id="final">0 CDF</span>
            </div>
        </div>

        <p id="time-msg" style="font-size:0.75em; color:var(--danger); text-align:center; margin-bottom:15px;">
            Vérification...
        </p>

        <button class="btn-withdraw" id="btnWithdraw" disabled>DEMANDER LE RETRAIT</button>
    </div>

</div>

<script>
    function calculate() {
        const amount = document.getElementById('amount').value;
        const fees = amount * 0.15;
        const final = amount - fees;

        if(amount >= 6000) {
            document.getElementById('fees').innerText = Math.floor(fees).toLocaleString() + " CDF";
            document.getElementById('final').innerText = Math.floor(final).toLocaleString() + " CDF";
        } else {
            document.getElementById('fees').innerText = "0 CDF";
            document.getElementById('final').innerText = "0 CDF";
        }
        checkRequirements();
    }

    function checkRequirements() {
        const amount = document.getElementById('amount').value;
        const btn = document.getElementById('btnWithdraw');
        const now = new Date();
        const hour = now.getHours();
        
        const isCorrectTime = (hour >= 11 && hour < 16);
        
        if (amount >= 6000 && isCorrectTime) {
            btn.disabled = false;
            document.getElementById('time-msg').style.color = "#27ae60";
            document.getElementById('time-msg').innerText = "Le service est ouvert.";
        } else if (!isCorrectTime) {
            btn.disabled = true;
            document.getElementById('time-msg').style.color = "#e74c3c";
            document.getElementById('time-msg').innerText = "Fermé (Ouvrira à 11h00).";
        } else {
            btn.disabled = true;
        }
    }
    checkRequirements();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, get, push, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "VOTRE_API_KEY",
    databaseURL: "https://firstsolar-e2ba3-default-rtdb.firebaseio.com",
    projectId: "firstsolar-e2ba3",
    appId: "VOTRE_APP_ID"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  document.getElementById('btnWithdraw').onclick = async () => {
      const amount = parseInt(document.getElementById('amount').value);
      const withdrawPhone = document.getElementById('phoneWithdraw').value.trim();
      const userPhone = localStorage.getItem('userPhone');
      
      if (!withdrawPhone || withdrawPhone.length < 10) { 
          alert("Entrez un numéro de réception valide."); 
          return; 
      }

      const btn = document.getElementById('btnWithdraw');
      btn.disabled = true;
      btn.innerText = "PATIENTEZ...";

      try {
          const userRef = ref(db, 'users/' + userPhone);
          const snap = await get(userRef);

          if (snap.exists()) {
              const userData = snap.val();
              const currentSolde = userData.solde || 0;

              // --- SÉCURITÉ : 1 RETRAIT PAR JOUR ---
              const today = new Date().toDateString();
              if (userData.dernier_retrait === today) {
                  alert("Limite atteinte : Vous ne pouvez faire qu'un seul retrait par jour.");
                  btn.disabled = false;
                  btn.innerText = "DEMANDER LE RETRAIT";
                  return;
              }

              if (currentSolde >= amount) {
                  // 1. Déduire du solde ET marquer la date du jour
                  await update(userRef, { 
                      solde: currentSolde - amount,
                      dernier_retrait: today 
                  });

                  // 2. Envoyer la demande à l'admin
                  const retraitRef = ref(db, 'demandes_retrait');
                  await push(retraitRef, {
                      telephone: userPhone,
                      numero_retrait: withdrawPhone,
                      montant: amount,
                      timestamp: Date.now()
                  });

                  alert("Félicitations ! Votre demande est envoyée. L'argent a été déduit de votre solde.");
                  window.location.href = "dashboard.html";
              } else {
                  alert("Solde insuffisant.");
                  btn.disabled = false;
                  btn.innerText = "DEMANDER LE RETRAIT";
              }
          }
      } catch (e) {
          alert("Erreur de connexion.");
          btn.disabled = false;
      }
  };
</script>
</body>
</html>
